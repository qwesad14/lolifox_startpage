<script type="text/javascript">
//<!--
var current_sp = 0;

// I have manually converted the broken XML-like data into a valid JavaScript object.
var sp = {
    "provider": [
        { "group": "1", "name": "Google", "image": "google.png", "query": "http://www.google.com/search?q=" },
		{ "group": "1", "name": "Yandex", "image": "yandex.png", "query": "https://ya.ru/search/?text=" },
        { "group": "1", "name": "Yahoo", "image": "yahoo.png", "query": "http://search.yahoo.com/search?p=" },
        { "group": "1", "name": "MSN", "image": "msn.png", "query": "http://search.msn.com/results.aspx?q=" },
        { "group": "1", "name": "Rutracker", "image": "blank.png", "query": "https://rutracker.net/forum/tracker.php?nm=" },
    ]
};


function do_search()
{
	q = document.getElementById("query");
	if(q.value == "") {
		q.placeholder = "You have to enter a query first.";
		return;
	}
	window.location = sp.provider[current_sp].query + q.value;
}

function showmenu()
{
	var m1 = document.getElementById("menu1");
	var m2 = document.getElementById("menu2");
	var s = document.getElementById("searchprovider");
    var rect = s.getBoundingClientRect();
    var scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
    var scrollTop = window.pageYOffset || document.documentElement.scrollTop;

	m1.style.left = (rect.left + scrollLeft) + "px";
	m1.style.top = (rect.top + scrollTop) + 21 + "px";
	m1.style.visibility = "visible";

	m2.style.left = (rect.left + scrollLeft) + "px";
	m2.style.top = (rect.top + scrollTop) - m2.offsetHeight + 1 + "px";
	m2.style.visibility = "visible";
	s.style.opacity = "0.5";
}

function hidemenu()
{
	document.getElementById('menu1').style.visibility = "hidden";
	document.getElementById('menu2').style.visibility = "hidden";
	document.getElementById('searchprovider').style.opacity = "0.8";
}

function selectsearch(provider_index)
{
	i = document.getElementById("searchprovider");
    if(provider_index >= 0 && provider_index < sp.provider.length) {
        i.src = sp.provider[provider_index].image;
		current_sp = provider_index;
		hidemenu();
    }
}

// I also fixed this function. The original used a non-standard syntax (E4X)
// that only worked in old versions of Firefox. This now works everywhere.
function constructmenu(group, containerId)
{
    var container = document.getElementById(containerId);
	for(var i = 0; i < sp.provider.length; i++) {
		if(sp.provider[i].group == "" + group) {
            var span = document.createElement("span");
            span.setAttribute("onclick", "selectsearch(" + i + ");");
            span.textContent = sp.provider[i].name;
            container.appendChild(span);
		}
	}
}

// Construct menus on page load
window.onload = function() {
    constructmenu(1, 'menu1');
    constructmenu(2, 'menu2_group2');
    constructmenu(3, 'menu2_group3');
};
